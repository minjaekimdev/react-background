<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>미션 2 · 같은 앱을 React로 — 선언형 UI</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        background: #f5f6fa; color: #222;
      }
      .app {
        max-width: 560px; margin: 40px auto; padding: 28px;
        background: #fff; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.07);
      }
      h1 { margin: 0 0 6px; font-size: 22px; }
      .sub { margin: 0 0 18px; color: #777; font-size: 13px; }
      .header { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; }
      .badge { background: #4b7bec; color: #fff; border-radius: 999px; padding: 2px 12px; font-weight: 700; }
      .row { display: flex; gap: 8px; margin: 12px 0; align-items: center; }
      .row input[type="text"] {
        flex: 1; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
      }
      button {
        padding: 9px 14px; border: none; border-radius: 8px;
        background: #4b7bec; color: #fff; font-size: 14px; cursor: pointer;
      }
      button:hover { filter: brightness(1.05); }
      .quick button { background: #eef1f7; color: #444; }
      .todo-list { list-style: none; margin: 12px 0; padding: 0; }
      .todo {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 12px; border: 1px solid #eee; border-radius: 10px;
        margin-bottom: 8px; background: #fafbfd;
      }
      .todo.done span { text-decoration: line-through; color: #aaa; }
      .todo .todo-delete { background: #ffe3e3; color: #d63031; padding: 6px 10px; font-size: 12px; }
      .summary {
        display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
        padding: 14px; background: #f1f5ff; border-radius: 10px; font-size: 14px;
      }
      .cheer { color: #2ecc71; font-weight: 700; }
      #progress-wrap { flex: 1; min-width: 120px; height: 8px; background: #e3e8f5; border-radius: 999px; overflow: hidden; }
      #progress-bar { height: 100%; width: 0%; background: #2ecc71; transition: width .2s ease; }
    </style>
  </head>
  <body>
    <!-- React는 이 div 안에 화면을 그립니다. 우리는 DOM을 직접 만지지 않습니다. -->
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
