<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>미션 5-② · 제어 컴포넌트의 대가</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        background: #f5f6fa; color: #222;
      }
      .app {
        max-width: 560px; margin: 40px auto; padding: 28px;
        background: #fff; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.07);
      }
      h1 { margin: 0 0 6px; font-size: 22px; }
      .sub { margin: 0 0 18px; color: #777; font-size: 13px; line-height: 1.6; }
      .stat { padding: 10px 14px; background: #fff4e5; border-radius: 10px; font-size: 13px; }
      form { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
      label { font-size: 13px; color: #555; font-weight: 600; display: block; }
      input[type="text"], input[type="email"], input[type="password"], textarea {
        width: 100%; margin-top: 6px; padding: 10px 12px;
        border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit;
      }
      textarea { resize: vertical; min-height: 80px; }
      .check { display: flex; align-items: center; gap: 8px; font-weight: 400; }
      .check input { width: auto; }
      .hint { font-weight: 400; color: #999; font-size: 12px; margin-top: 4px; }
      .msg { font-size: 12.5px; margin-top: 6px; min-height: 18px; }
      .msg.ok { color: #2ecc71; }
      .msg.bad { color: #e74c3c; }
      button {
        padding: 11px; border: none; border-radius: 8px;
        background: #4b7bec; color: #fff; font-size: 15px; cursor: pointer;
      }
      .guide { margin-top: 20px; padding: 14px; background: #f1f5ff; border-radius: 10px; font-size: 13px; line-height: 1.8; }
      .guide code { background: #e8edf7; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
