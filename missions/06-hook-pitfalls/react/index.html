<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>미션 6 · 훅의 함정 — 스냅샷과 의존성 배열</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        background: #f5f6fa; color: #222;
      }
      .app {
        max-width: 560px; margin: 40px auto; padding: 28px;
        background: #fff; border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.07);
      }
      h1 { margin: 0 0 6px; font-size: 22px; }
      h2 { font-size: 16px; margin: 26px 0 8px; }
      .sub { margin: 0 0 18px; color: #777; font-size: 13px; line-height: 1.6; }
      .panel {
        padding: 18px; border: 1px solid #eee; border-radius: 12px; margin: 14px 0;
        background: #fafbfd;
      }
      .timer { font-size: 42px; font-weight: 800; letter-spacing: 2px; margin: 6px 0; }
      .timer small { font-size: 14px; font-weight: 400; color: #888; letter-spacing: 0; }
      button {
        padding: 9px 14px; border: none; border-radius: 8px; margin-right: 6px;
        background: #4b7bec; color: #fff; font-size: 14px; cursor: pointer;
      }
      button:hover { filter: brightness(1.05); }
      input[type="text"] {
        padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; width: 100%;
        margin: 6px 0;
      }
      ul { margin: 8px 0 0; padding-left: 20px; font-size: 14px; line-height: 1.8; }
      .warn { background: #fff0f0; color: #c0392b; padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
